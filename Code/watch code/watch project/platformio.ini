; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
; Using Adafruit QT Py ESP32-C6 board for compact size and compatibility.
; Ensure pin mappings below match your hardware wiring for this board.
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 160000000L
lib_deps =
	adafruit/Adafruit GC9A01A @ ^1.1.0
	adafruit/Adafruit GFX Library @ ^1.12.3
	bblanchon/ArduinoJson @ ^7.4.2

build_flags =
	-DTFT_SCK_PIN=6
	-DTFT_MOSI_PIN=7
	-DTFT_MISO_PIN=5
	-DTFT_CS_PIN=15
	-DTFT_DC_PIN=18
	-DTFT_RST_PIN=19
	-DTFT_BL_PIN=4
	-DMENU_BUTTON_PIN=21
	-DBUTTON_PRIMARY_PIN=20
	-DTOUCH_SDA_PIN=11
	-DTOUCH_SCL_PIN=12
	-DTOUCH_I2C_ADDR=0x15
	-DTOUCH_INT_PIN=2
	-DTOUCH_RST_PIN=3
; Pins mapped from ESP32-C6 DevKitC pinout; override here if your wiring differs.