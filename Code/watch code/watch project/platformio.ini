; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32c3]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	adafruit/Adafruit GC9A01A @ ^1.1.0
	adafruit/Adafruit GFX Library @ ^1.12.3
	bblanchon/ArduinoJson @ ^7.4.2

; Note: If the C6 Arduino env above fails due to PlatformIO version, you can:
; 1) Update PlatformIO core/platforms, or
; 2) Temporarily use the ESP32-S3 env, or
; 3) Switch C6 to framework=espidf (API changes required), or
; 4) Build with Arduino IDE using the latest Espressif Arduino core.